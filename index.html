<script>
const RAW=`@Reported Statements|Reported Statements|Tường thuật câu trần thuật|Câu tường thuật (reported speech) dùng để thuật lại lời người khác nói mà không trích dẫn nguyên văn. Với câu trần thuật, ta dùng said (that) hoặc told + tân ngữ (that), rồi lùi thì động từ và đổi đại từ, trạng từ cho phù hợp.
U|"I am tired," she said. → She said (that) she was tired.|Cô ấy nói rằng cô ấy mệt.
U|"We will help you," they told me. → They told me (that) they would help me.|Họ nói với tôi rằng họ sẽ giúp tôi.
U|"I have finished," he said. → He said (that) he had finished.|Anh ấy nói rằng anh ấy đã làm xong.
S|S + said (that) + S + V (lùi thì)|He said (that) he liked pizza.
S|S + told + O + (that) + S + V|She told me (that) she was busy.
S|"...," S + said to + O → S + told + O + ...|"I'm leaving," he said to me. → He told me he was leaving.
S|Đổi đại từ, trạng từ chỉ thời gian và nơi chốn|"I'll see you tomorrow," she said. → She said she would see me the next day.
N|"say" không có tân ngữ trực tiếp, còn "tell" luôn có tân ngữ.|She said she was ill. / She told me she was ill. (không nói: She said me.)
N|Đại từ đổi theo người nói và người nghe.|"I love my job," Tom said. → Tom said he loved his job.
N|"that" có thể được bỏ.|He said (that) he was late.
N|Trạng từ: now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there.|"I'm here now," she said. → She said she was there then.
A|Thuật lại thông tin cho người thứ ba.|"The meeting starts at 9," my boss said. → My boss said the meeting started at 9.
A|Kể lại một câu chuyện.|"I lost my keys," he said. → He said he had lost his keys.
A|Tường thuật một tin nhắn.|"I'll call you later," Mai told me. → Mai told me she would call me later.
X|M|"I am hungry," he said. → He said he ___ hungry.|is/was/were|1
X|M|She ___ me that she was busy.|said/told/said to|1
X|M|"I will call you tomorrow," she said. → She said she ___ call me the next day.|will/would/can|1
X|F|"We like this film," they said. → They said they ___ that film.|liked
X|F|"I live in Hue," he said. → He said he ___ in Hue.|lived
X|W|"I am tired," she said.|She said she was tired/She said that she was tired
X|W|"I have finished my work," Tom said.|Tom said he had finished his work/Tom said that he had finished his work
X|T|She said me that she was late.|S
X|T|He told me that he was leaving.|Đ
X|O|She told me that she was very busy
@Reported Questions|Reported Questions|Tường thuật câu hỏi|Câu hỏi tường thuật dùng để thuật lại một câu hỏi của người khác. Ta chuyển câu hỏi thành câu trần thuật: trật tự S + V, không dùng dấu "?" và không dùng trợ động từ do/does/did. Câu hỏi Yes/No dùng if hoặc whether, câu hỏi Wh- giữ nguyên từ để hỏi.
U|"Do you like coffee?" she asked me. → She asked me if I liked coffee.|Cô ấy hỏi tôi có thích cà phê không.
U|"Where do you live?" he asked. → He asked me where I lived.|Anh ấy hỏi tôi sống ở đâu.
U|"Have you finished?" the teacher asked. → The teacher asked whether I had finished.|Cô giáo hỏi tôi đã làm xong chưa.
S|Yes/No: S + asked (+ O) + if/whether + S + V (lùi thì)|He asked if I was ready.
S|Wh-question: S + asked (+ O) + wh-word + S + V|She asked where he worked.
S|Wh- làm chủ ngữ: S + asked + wh-word + V|"Who called you?" → He asked who had called me.
S|S + wondered / wanted to know + if / wh-word|I wondered what he wanted.
N|Dùng trật tự câu trần thuật, không đảo trợ động từ.|"Where is she?" → He asked where she was. (không nói: where was she)
N|Bỏ do/does/did và bỏ dấu hỏi.|"Do you smoke?" → He asked if I smoked.
N|if và whether có nghĩa giống nhau, whether thường đi với "or not".|She asked whether or not I would come.
N|Dùng động từ ask, không dùng say hoặc tell.|He asked me why I was late.
A|Thuật lại câu hỏi phỏng vấn.|"Why do you want this job?" the manager asked. → The manager asked why I wanted that job.
A|Thuật lại câu hỏi của khách hàng.|"Is the shop open?" a customer asked. → A customer asked if the shop was open.
A|Kể lại một cuộc trò chuyện.|"What time did you arrive?" he asked. → He asked what time I had arrived.
X|M|"Do you like tea?" she asked. → She asked ___ I liked tea.|do/if/that|1
X|M|"Where do you live?" → He asked me where I ___.|live/lived/do live|1
X|M|"Is she at home?" → He asked ___ she was at home.|that/whether/what|1
X|F|"What are you doing?" he asked. → He asked me what I ___ (do).|was doing
X|F|"Have you seen my keys?" she asked. → She asked if I ___ (see) her keys.|had seen
X|W|"Where do you work?" he asked me.|He asked me where I worked
X|W|"Do you speak French?" she asked.|She asked if I spoke French/She asked whether I spoke French
X|T|He asked me where was I going.|S
X|T|She asked if I liked music.|Đ
X|O|She asked me what time the film started
@Reported Commands|Reported Commands|Tường thuật mệnh lệnh, yêu cầu|Câu mệnh lệnh, yêu cầu, lời khuyên tường thuật dùng để thuật lại điều ai đó bảo hoặc nhờ người khác làm. Cấu trúc: S + told/asked/ordered... + O + (not) to V. Loại câu này không lùi thì.
U|"Close the door," he said to me. → He told me to close the door.|Anh ấy bảo tôi đóng cửa.
U|"Please help me," she said. → She asked me to help her.|Cô ấy nhờ tôi giúp cô ấy.
U|"Don't be late," the teacher said. → The teacher told us not to be late.|Cô giáo bảo chúng tôi đừng đến muộn.
S|S + told + O + to V (mệnh lệnh)|The boss told me to finish the report.
S|S + asked + O + to V (yêu cầu lịch sự)|She asked him to wait.
S|S + told/asked + O + not to V (phủ định)|He told me not to touch it.
S|S + ordered/advised/warned/begged + O + (not) to V|The officer ordered them to stop.
N|Luôn có tân ngữ sau tell, ask, order.|He told me to sit down. (không nói: He told to sit down.)
N|Phủ định đặt "not" trước "to", không dùng "don't".|She told us not to talk.
N|Bỏ "please" khi tường thuật, chọn động từ phù hợp với ngữ khí.|"Please sit down." → She asked me to sit down.
N|Đổi đại từ và trạng từ cho phù hợp.|"Bring it here." → He told me to bring it there.
A|Truyền đạt chỉ dẫn.|"Take two tablets a day," the doctor said. → The doctor told me to take two tablets a day.
A|Truyền đạt lời nhờ lịch sự.|"Could you open the window?" she said. → She asked me to open the window.
A|Truyền đạt lời cảnh báo.|"Don't touch the wire!" he said. → He warned me not to touch the wire.
X|M|"Sit down," the teacher said. → The teacher told us ___ down.|sit/to sit/sat|1
X|M|"Don't talk," he said. → He told us ___.|don't talk/not to talk/to not talk|1
X|M|"Please help me," she said. → She ___ me to help her.|asked/said/told that|0
X|F|"Open the window," he said to me. → He told me ___ (open) the window.|to open
X|F|"Don't be late," she said. → She told me ___ (be) late.|not to be
X|W|"Close the door," he said to me.|He told me to close the door
X|W|"Don't touch that," she said to him.|She told him not to touch that
X|T|He told me close the door.|S
X|T|She asked me not to make noise.|Đ
X|O|He told me to finish the report
@advise|advise|Khuyên ai làm gì|Advise nghĩa là khuyên. Động từ này thường dùng để tường thuật lời khuyên (should, ought to, had better, If I were you...). Cấu trúc chính: advise + O + to V, advise + V-ing, hoặc advise + that + S + (should) + V.
U|"You should see a lawyer," he said. → He advised me to see a lawyer.|Anh ấy khuyên tôi gặp luật sư.
U|The doctor advised me to rest.|Bác sĩ khuyên tôi nghỉ ngơi.
U|The guide advised visiting early.|Hướng dẫn viên khuyên nên đến sớm.
S|advise + O + to V|He advised me to save money.
S|advise + O + not to V (phủ định)|She advised him not to go.
S|advise + V-ing|The guide advised visiting early.
S|advise + that + S + (should) + V|I advise that you (should) apply now.
N|advise là động từ, advice là danh từ không đếm được.|He gave me some advice. / He advised me.
N|Khi dùng to V, bắt buộc có tân ngữ.|She advised me to wait. (không nói: She advised to wait.)
N|Các câu "should", "had better", "If I were you" đều có thể chuyển thành advise.|"If I were you, I'd study more," he said. → He advised me to study more.
A|Chuyển lời khuyên.|"You should drink more water," she said. → She advised me to drink more water.
A|Khuyên ai đừng làm gì.|"You shouldn't go out," he said. → He advised me not to go out.
A|Chuyển câu gợi ý dạng câu hỏi.|"Why don't you rest?" she said. → She advised me to rest.
X|M|The doctor advised me ___ more water.|drink/to drink/drinking|1
X|M|"You shouldn't go," he said. → He advised me ___.|not to go/to not go/don't go|0
X|M|He gave me some ___ about my career.|advise/advice/advices|1
X|F|"You should see a doctor," she said. → She advised me ___ (see) a doctor.|to see
X|F|He advised ___ (take) a taxi.|taking
X|W|"You should rest more," the doctor said to me.|The doctor advised me to rest more
X|W|"You shouldn't eat so much sugar," she said to him.|She advised him not to eat so much sugar
X|T|She advised me to go to bed early.|Đ
X|T|He advised me take a taxi.|S
X|O|The doctor advised me to rest for a week
@recommend|recommend|Giới thiệu, đề xuất nên làm|Recommend nghĩa là giới thiệu hoặc đề xuất nên làm gì. Cấu trúc thường gặp: recommend + V-ing, recommend + (that) + S + (should) + V, và recommend + N + to + người.
U|I recommend visiting Hoi An.|Tôi đề xuất nên đến Hội An.
U|The teacher recommended that we read this book.|Giáo viên khuyên chúng tôi nên đọc cuốn sách này.
U|She recommended a good restaurant to me.|Cô ấy giới thiệu cho tôi một nhà hàng ngon.
S|recommend + V-ing|He recommended taking the train.
S|recommend + (that) + S + (should) + V|She recommended that I (should) apply.
S|recommend + N + to + sb|I recommend this film to you.
S|recommend + sb + to V (ít dùng hơn)|They recommended me to try the soup.
N|Sau that dùng động từ nguyên mẫu hoặc should.|I recommend that he go. / I recommend that he should go.
N|Không dùng recommend + to V trực tiếp.|I recommend visiting. (không nói: I recommend to visit.)
N|"You should try...", "I'd recommend..." có thể tường thuật bằng recommend.|"You should try the soup," he said. → He recommended (that) I try the soup.
A|Giới thiệu địa điểm.|"You should visit Hue," she said. → She recommended visiting Hue.
A|Giới thiệu sản phẩm.|"Try this phone," he said. → He recommended this phone to me.
A|Đề xuất trong công việc.|"We should hire more staff," the manager said. → The manager recommended hiring more staff.
X|M|I recommend ___ the museum.|to visit/visiting/visited|1
X|M|She recommended that I ___ for the job.|apply/applied/applies|0
X|M|He recommended this film ___ me.|for/to/at|1
X|F|He recommended ___ (take) the train.|taking
X|F|The doctor recommended that she ___ (rest).|rest/should rest
X|W|"You should try the soup," he said to me.|He recommended trying the soup/He recommended that I try the soup/He recommended that I should try the soup
X|W|"We should hire more staff," the manager said.|The manager recommended hiring more staff/The manager recommended that they hire more staff/The manager recommended that they should hire more staff
X|T|I recommend to visit Hoi An.|S
X|T|She recommended that he see a doctor.|Đ
X|O|He recommended taking the train to Hanoi
@suggest|suggest|Đề nghị, gợi ý|Suggest nghĩa là đề nghị hoặc gợi ý. Động từ này tường thuật các câu như Let's..., Why don't we...?, How about...?, Shall we...?. Cấu trúc: suggest + V-ing hoặc suggest + (that) + S + (should) + V. Không dùng suggest + O + to V.
U|"Let's go to the beach," she said. → She suggested going to the beach.|Cô ấy đề nghị đi biển.
U|"Why don't we eat out?" he said. → He suggested that we eat out.|Anh ấy gợi ý chúng tôi ăn ngoài.
U|I suggest that he see a doctor.|Tôi đề nghị anh ấy đi khám bác sĩ.
S|suggest + V-ing|She suggested going to the cinema.
S|suggest + (that) + S + (should) + V|He suggested that we should leave early.
S|suggest + N|I suggest a short break.
S|suggest + that + mệnh đề (nghĩa "cho thấy")|The report suggests that sales are falling.
N|Không dùng suggest + O + to V.|He suggested that I go. (không nói: He suggested me to go.)
N|Khi dùng V-ing, người nói thường cũng tham gia hành động.|She suggested going out. (cả hai cùng đi)
N|Let's, Why don't we, How about, Shall we đều chuyển thành suggest.|"How about going to the park?" he said. → He suggested going to the park.
A|Gợi ý một hoạt động chung.|"Let's have a picnic," Mai said. → Mai suggested having a picnic.
A|Gợi ý cho người khác.|"Why don't you ask your teacher?" she said. → She suggested that I ask my teacher.
A|Đề xuất phương án.|"Shall we take a taxi?" he said. → He suggested taking a taxi.
X|M|She suggested ___ to the cinema.|to go/going/go|1
X|M|He suggested that I ___ a doctor.|see/saw/to see|0
X|M|"Let's have a picnic," she said. → She suggested ___ a picnic.|to have/having/have|1
X|F|"How about eating out?" he said. → He suggested ___ (eat) out.|eating
X|F|I suggest that she ___ (call) the manager.|call/should call
X|W|"Let's go to the beach," Mai said.|Mai suggested going to the beach
X|W|"Why don't you ask your teacher?" she said to me.|She suggested that I ask my teacher/She suggested that I should ask my teacher
X|T|He suggested me to go home.|S
X|T|She suggested taking a taxi.|Đ
X|O|She suggested going to the beach after school
@deny|deny|Phủ nhận, chối|Deny nghĩa là phủ nhận hoặc chối rằng mình đã làm điều gì. Ta dùng deny để tường thuật những câu nói dạng "I didn't...". Cấu trúc: deny + V-ing, deny + having + V3, hoặc deny + (that) + S + V (lùi thì).
U|"I didn't take the money," he said. → He denied taking the money.|Anh ta phủ nhận việc đã lấy tiền.
U|She denied that she had lied.|Cô ấy phủ nhận việc đã nói dối.
U|He denied having seen her.|Anh ta phủ nhận đã gặp cô ấy.
S|deny + V-ing|He denied stealing the bike.
S|deny + having + V3/V-ed|She denied having broken the vase.
S|deny + (that) + S + V (lùi thì)|They denied that they knew him.
S|deny + N|He denied the accusation.
N|Deny đã mang nghĩa phủ định, không thêm "not" vào mệnh đề sau.|He denied taking it. (không nói: He denied not taking it.)
N|Không dùng deny + to V.|He denied stealing the bike. (không nói: He denied to steal the bike.)
N|"I didn't...", "I never..." chuyển thành deny + V-ing.|"I didn't do it," he said. → He denied doing it.
N|"didn't deny" có nghĩa là không chối, tức là ngầm thừa nhận.|He didn't deny taking the money.
A|Tường thuật lời chối tội.|"I didn't break the window," Tom said. → Tom denied breaking the window.
A|Tường thuật lời phủ nhận thông tin.|"I'm not leaving the company," she said. → She denied that she was leaving the company.
A|Tường thuật lời phủ nhận từng gặp.|"I never met him," she said. → She denied ever having met him.
X|M|"I didn't take the money," he said. → He denied ___ the money.|to take/taking/take|1
X|M|She denied ___ the vase.|to break/having broken/break|1
X|M|They denied ___ they knew him.|that/to/for|0
X|F|He denied ___ (steal) the bike.|stealing
X|F|She denied that she ___ (lie).|had lied
X|W|"I didn't break the window," Tom said.|Tom denied breaking the window/Tom denied having broken the window
X|W|"I don't know him," she said.|She denied knowing him/She denied that she knew him
X|T|He denied to take the money.|S
X|T|She denied having lied.|Đ
X|O|He denied stealing the money
@admit|admit|Thừa nhận|Admit nghĩa là thừa nhận một điều gì đó (thường là lỗi lầm hoặc sự thật không dễ nói ra). Cấu trúc: admit + V-ing, admit + having + V3, admit + to + V-ing, hoặc admit + (that) + S + V (lùi thì).
U|"I broke the window," he said. → He admitted breaking the window.|Anh ấy thừa nhận đã làm vỡ cửa sổ.
U|She admitted that she had made a mistake.|Cô ấy thừa nhận đã mắc lỗi.
U|They admitted being late.|Họ thừa nhận đã đến muộn.
S|admit + V-ing|He admitted taking the money.
S|admit + having + V3/V-ed|She admitted having lied.
S|admit + to + V-ing|He admitted to stealing the car.
S|admit + (that) + S + V (lùi thì)|He admitted that he was wrong.
N|Không dùng admit + to V.|He admitted taking it. (không nói: He admitted to take it.)
N|Trong admit to + V-ing, "to" là giới từ nên theo sau là V-ing.|She admitted to forgetting the meeting.
N|Admit còn có nghĩa "cho vào", thường dùng ở thể bị động.|He was admitted to hospital.
A|Thừa nhận lỗi.|"I forgot the meeting," he said. → He admitted forgetting the meeting.
A|Thừa nhận sự thật.|"I'm afraid of dogs," she said. → She admitted that she was afraid of dogs.
A|Thừa nhận trách nhiệm.|"It was my fault," Lan said. → Lan admitted that it was her fault.
X|M|"I broke the vase," he said. → He admitted ___ the vase.|to break/breaking/break|1
X|M|She admitted ___ a mistake.|having made/to make/make|0
X|M|He admitted ___ the money.|to take/to taking/take|1
X|F|She admitted ___ (be) wrong.|being
X|F|He admitted that he ___ (forget) the meeting.|had forgotten
X|W|"I forgot the meeting," he said.|He admitted forgetting the meeting/He admitted that he had forgotten the meeting
X|W|"It was my fault," Lan said.|Lan admitted that it was her fault/Lan admitted it was her fault
X|T|He admitted to take the money.|S
X|T|They admitted being late.|Đ
X|O|She admitted that she had made a mistake
@Tense Backshifting|Tense Backshifting|Lùi thì trong câu tường thuật|Lùi thì (backshift) là việc chuyển động từ trong lời nói trực tiếp về quá khứ một bậc khi động từ tường thuật (said, told, asked...) ở thì quá khứ. Lùi thì đi kèm với việc đổi đại từ và trạng từ chỉ thời gian, nơi chốn.
U|"I work here," he said. → He said he worked there.|Hiện tại đơn lùi thành quá khứ đơn.
U|"I am working," she said. → She said she was working.|Hiện tại tiếp diễn lùi thành quá khứ tiếp diễn.
U|"I have seen it," he said. → He said he had seen it.|Hiện tại hoàn thành lùi thành quá khứ hoàn thành.
S|Hiện tại đơn → quá khứ đơn|"I like tea." → He said he liked tea.
S|Hiện tại tiếp diễn → quá khứ tiếp diễn|"I'm reading." → She said she was reading.
S|Hiện tại hoàn thành → quá khứ hoàn thành|"I've finished." → He said he had finished.
S|Quá khứ đơn → quá khứ hoàn thành|"I saw him." → She said she had seen him.
S|will → would, can → could, may → might, must → had to|"I will go." → He said he would go.
S|Quá khứ hoàn thành giữ nguyên|"I had left." → She said she had left.
N|Không lùi thì khi động từ tường thuật ở hiện tại.|She says she is tired.
N|Không lùi thì khi nói về sự thật hiển nhiên.|"The earth goes round the sun," the teacher said. → The teacher said the earth goes round the sun.
N|should, would, could, might, ought to giữ nguyên.|"You should rest," he said. → He said I should rest.
N|Trạng từ đổi theo: ago → before, this → that, next week → the following week, last year → the year before.|"I met him last year," she said. → She said she had met him the year before.
A|Tường thuật trong lúc kể chuyện.|"I am waiting for you," he said. → He said he was waiting for me.
A|Báo cáo công việc.|"We have completed the project," they said. → They said they had completed the project.
A|Tường thuật kế hoạch.|"We will launch next week," she said. → She said they would launch the following week.
X|M|"I work here," he said. → He said he ___ there.|works/worked/had worked|1
X|M|"I have seen it," she said. → She said she ___ it.|has seen/had seen/saw|1
X|M|"I will come," he said. → He said he ___ come.|will/would/can|1
X|F|"I am reading," she said. → She said she ___ (read).|was reading
X|F|"I saw him," he said. → He said he ___ (see) him.|had seen
X|W|"We can help you," they said.|They said they could help me/They said that they could help me
X|W|"I must go now," she said.|She said she had to go then/She said that she had to go then
X|T|"The earth goes round the sun," the teacher said. → The teacher said the earth goes round the sun.|Đ
X|T|"I must go," she said. → She said she must went.|S

const GR=[['1. Reported Statements','#2340D8','💬',[0]],['2. Reported Questions','#B0206A','❓',[1]],['3. Reported Commands','#0A7A5C','📢',[2]],['4. Reporting Verbs','#A04A00','🗣️',[3,4,5,6,7]],['5. Tense Backshifting','#6D28D9','⏪',[8]]];
const SEC=['Định nghĩa','Cách dùng','Cấu trúc','Lưu ý','Cách áp dụng','Bài tập'],RM=['I','II','III','IV','V','VI'];
const D=RAW.trim().split('\n@').map((b,k)=>{const L=b.replace(/^@/,'').split('\n'),h=L[0].split('|'),t={id:'t'+(k+1),n:h[0],tt:h[1],sub:h[2],def:h[3],U:[],S:[],N:[],A:[],X:[]};
 L.slice(1).forEach(l=>{const p=l.split('|');t[p[0]].push(p.slice(1))});t.col=GR.find(g=>g[3].includes(k))[1];return t});
let done={};try{done=JSON.parse(localStorage.getItem('rs-done')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('rs-done',JSON.stringify(done))}catch(e){}};
const $=id=>document.getElementById(id),SH=a=>[...a].sort(()=>Math.random()-.5);
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.split('→').pop().replace(/\(.*?\)/g,'').replace(/\bV3\/V-ed|\bV-ing/g,'').replace(/"/g,''));u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.preventDefault();speak(b.dataset.say)}});
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,"]/g,'').replace(/\s+/g,' ').trim();
const upd=()=>{$('pg').textContent=`Đã hoàn thành ${Object.keys(done).length}/${D.length} chủ đề`};

function renderHome(){
  const tile=t=>`<a class="tile${done[t.id]!=null?' ok':''}" data-s="${done[t.id]}/10" href="#${t.id}" style="--c:${t.col}"><code>${t.sub}</code><b>${t.tt}</b><span>6 phần · 10 bài tập</span></a>`;
  const rows=D.map(t=>`<tr><td><b>${t.n}</b></td><td>${t.S[0][0]}</td><td>${t.S[0][1]}</td></tr>`).join('');
  $('app').innerHTML=`<main class="w"><header class="hero"><h1>Câu <span>tường thuật</span> trong tiếng Anh</h1><p>Thuật lại lời người khác một cách chính xác: câu trần thuật, câu hỏi, mệnh lệnh, các động từ tường thuật và quy tắc lùi thì. Mỗi chủ đề có 6 phần và 10 bài tập.</p>
  <div class="demo"><small>Lời nói trực tiếp</small><div>"I am learning English," she said.</div><small>Câu tường thuật</small><div class="r">She said she was learning English.</div></div></header>
  ${GR.map(g=>`<h2 class="grp" style="--c:${g[1]}"><i>${g[2]}</i>${g[0]}</h2><div class="tiles">${g[3].map(i=>tile(D[i])).join('')}</div>`).join('')}
  <h2 class="grp" style="--c:#2340D8"><i>📋</i>Bảng tóm tắt nhanh</h2><div class="tbw"><table class="tb"><tr><th>Chủ đề</th><th>Cấu trúc</th><th>Ví dụ</th></tr>${rows}</table></div><div style="height:60px"></div></main>`}

const ff=(el,ok,m)=>{const f=el.querySelector('.fb');f.className='fb '+(ok?'g':'b');f.textContent=ok?'Chính xác! 🎉':'Chưa đúng. '+m};
const R={
 M(x,el,fin){const O=x[2].split('/'),a=+x[3];el.innerHTML=`<p class="q">${x[1]}</p><div class="opts">${O.map((v,i)=>`<button class="opt" data-i="${i}">${v}</button>`).join('')}</div><div class="fb"></div>`;
  const B=el.querySelectorAll('.opt');B.forEach(b=>b.onclick=()=>{if(el.dataset.d)return;el.dataset.d=1;const ok=+b.dataset.i===a;b.classList.add(ok?'good':'bad');if(!ok)B[a].classList.add('good');ff(el,ok,'Đáp án đúng: '+O[a]);fin(ok)})},
 T(x,el,fin){const ans=x[2]==='Đ';el.innerHTML=`<p class="q">${x[1]}</p><div class="opts"><button class="opt" data-v="1">✔ Đúng</button><button class="opt" data-v="0">✘ Sai</button></div><div class="fb"></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(el.dataset.d)return;el.dataset.d=1;const ok=(b.dataset.v==='1')===ans;b.classList.add(ok?'good':'bad');ff(el,ok,'Câu này '+(ans?'đúng':'sai')+'.');fin(ok)})},
 F(x,el,fin){const[a,b]=x[1].split('___');el.innerHTML=`<p class="q">${a}<input class="in" aria-label="Điền đáp án" autocomplete="off">${b}</p><button class="btn" style="padding:10px 22px;font-size:16px">Kiểm tra</button><div class="fb"></div>`;
  el.querySelector('button').onclick=()=>{if(el.dataset.d)return;const v=norm(el.querySelector('.in').value);if(!v)return;el.dataset.d=1;const ok=x[2].split('/').some(s=>norm(s)===v);ff(el,ok,'Đáp án: '+x[2].split('/')[0]);fin(ok)}},
 W(x,el,fin){el.innerHTML=`<p class="q">Viết lại thành câu tường thuật:</p><p class="q" style="color:var(--c)">${x[1]}</p><input class="in full" aria-label="Câu tường thuật" autocomplete="off" placeholder="Gõ câu của bạn..."><button class="btn" style="padding:10px 22px;font-size:16px">Kiểm tra</button><div class="fb"></div>`;
  el.querySelector('button').onclick=()=>{if(el.dataset.d)return;const v=norm(el.querySelector('.in').value);if(!v)return;el.dataset.d=1;const ok=x[2].split('/').some(s=>norm(s)===v);ff(el,ok,'Đáp án: '+x[2].split('/')[0]+'.');fin(ok)}},
 O(x,el,fin){const s=x[1],w=s.split(' ');el.innerHTML=`<p class="q">Sắp xếp các từ thành câu đúng</p><div class="ans"></div><div class="bank">${SH(w.map((v,i)=>i)).map(i=>`<button class="opt">${w[i]}</button>`).join('')}</div><button class="btn" style="padding:10px 22px;font-size:16px;margin-top:10px">Kiểm tra</button><div class="fb"></div>`;
  const A=el.querySelector('.ans'),B=el.querySelector('.bank');el.querySelectorAll('.bank .opt').forEach(b=>b.onclick=()=>{if(!el.dataset.d)(b.parentNode===B?A:B).appendChild(b)});
  el.querySelector('.btn').onclick=()=>{if(el.dataset.d||!A.children.length)return;el.dataset.d=1;const ok=[...A.children].map(c=>c.textContent).join(' ')===s;ff(el,ok,'Đáp án: '+s);fin(ok)}}};

function renderLesson(k){
  const t=D[k],ex=(e,v)=>`<div class="en"><span>${e}</span><button class="say" data-say="${e.replace(/"/g,'')}" aria-label="Nghe">🔊</button></div>${v?`<div class="vi">${v}</div>`:''}`;
  const sec=(i,b)=>`<section class="sec" id="p${i}"><h2><i>${RM[i]}</i>${SEC[i]}</h2>${b}</section>`;
  $('app').innerHTML=`<main class="w" style="--c:${t.col}"><div class="crumb"><a href="#home">← Tất cả chủ đề</a><span>${k+1} / ${D.length}</span></div>
  <header class="lh"><small>Reported speech</small><h1>${t.tt}</h1><p>${t.sub}</p></header>
  <nav class="sn">${SEC.map((s,i)=>`<a href="#p${i}">${RM[i]}. ${s}</a>`).join('')}</nav>
  ${sec(0,`<p class="def">${t.def}</p>`)}
  ${sec(1,t.U.map((u,i)=>`<div class="card"><div class="lab">Ví dụ ${i+1}</div>${ex(u[0],u[1])}</div>`).join(''))}
  ${sec(2,t.S.map((s,i)=>`<div class="card"><div class="f" data-k="${i+1}">${s[0]}</div>${ex(s[1])}</div>`).join(''))}
  ${sec(3,t.N.map(n=>`<div class="card"><div class="f" data-k="!" style="color:var(--ink);font-size:19px">${n[0]}</div>${ex(n[1])}</div>`).join(''))}
  ${sec(4,t.A.map((a,i)=>`<div class="card"><div class="lab">Tình huống ${i+1}: ${a[0]}</div>${ex(a[1])}</div>`).join(''))}
  ${sec(5,`<div id="exl"></div><div class="res"><span id="sc"></span><button class="btn" id="rs" style="background:var(--bg);color:var(--ink)">Làm lại</button></div>`)}
  <div class="nav2">${k?`<a class="btn gh" href="#${D[k-1].id}">← ${D[k-1].n}</a>`:'<span></span>'}${k<D.length-1?`<a class="btn" href="#${D[k+1].id}">${D[k+1].n} →</a>`:'<span></span>'}</div></main>`;
  const run=()=>{$('exl').innerHTML='';let sc=0,an=0;const N=t.X.length;$('sc').textContent=`Điểm: 0 / ${N}`;
   t.X.forEach((x,i)=>{const el=document.createElement('div');el.className='ex';el.innerHTML=`<h3>Câu ${i+1} · ${{M:'Trắc nghiệm',F:'Điền từ',W:'Viết lại câu',T:'Đúng / Sai',O:'Sắp xếp câu'}[x[0]]}</h3>`;const box=document.createElement('div');el.appendChild(box);$('exl').appendChild(el);
    R[x[0]](x,box,ok=>{an++;if(ok)sc++;$('sc').textContent=`Điểm: ${sc} / ${N}`+(an===N?' · Hoàn thành! 🎉':'');if(an===N){done[t.id]=sc;save();upd()}})})};
  $('rs').onclick=run;run()}

function route(){const h=location.hash.slice(1);if(/^p\d$/.test(h))return;const k=D.findIndex(t=>t.id===h);k<0?renderHome():renderLesson(k);upd();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
